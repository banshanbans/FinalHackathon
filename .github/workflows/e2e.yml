name: Manual E2E

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-e2e:
    name: browser-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/presentation/package-lock.json
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -e '.[dev]'
      - run: npm --prefix apps/web ci
      - run: npm --prefix apps/presentation ci
      - run: npx --prefix apps/web playwright install --with-deps chromium
      - run: npm --prefix apps/web run test:e2e
      - run: npm --prefix apps/web run test:e2e:presentation
