name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/check_repository.py

  python:
    name: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check simulation apps/api scripts
      - run: ruff format --check simulation apps/api scripts
      - run: python -m pytest
      - run: python scripts/validate_data.py
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/apps/api/src
      - run: python scripts/validate_standard_map.py
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/apps/api/src
      - run: python scripts/validate_presentation_map.py
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/apps/api/src

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm --prefix apps/web ci
      - run: npm --prefix apps/web run lint
      - run: npm --prefix apps/web run test
      - run: npm --prefix apps/web run build

  presentation-roadshow:
    name: presentation-roadshow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            apps/presentation/package-lock.json
            apps/roadshow/package-lock.json
      - run: npm --prefix apps/presentation ci
      - run: npm --prefix apps/roadshow ci
      - run: npm --prefix apps/presentation run typecheck
      - run: npm --prefix apps/presentation run test:geometry
      - run: npm --prefix apps/presentation run build
      - run: npm --prefix apps/roadshow run verify

  containers:
    name: containers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker build -f deploy/m35/Dockerfile.api -t 13110-api:ci .
      - run: docker build -f deploy/m35/Dockerfile.web -t 13110-presentation:ci .
      - run: docker compose -f deploy/m35/compose.production.yml config --quiet
        env:
          POLICYSCOPE_ENV_FILE: ${{ github.workspace }}/.env.example
