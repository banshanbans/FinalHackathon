name: policyscope-m35

services:
  m35-api:
    image: policyscope-m35-api:20260814-deepseek-fix13
    build:
      context: ../..
      dockerfile: deploy/m35/Dockerfile.api.incremental
    env_file:
      - /opt/13110/shared/.env.deepseek
    environment:
      POLICYSCOPE_RUN_MODE: cache
      POLICYSCOPE_CACHE_MISS_MODE: live
      POLICYSCOPE_LLM_BASE_URL: https://api.deepseek.com
      POLICYSCOPE_CENTRAL_MODEL: deepseek-v4-flash
      POLICYSCOPE_PROVINCE_MODEL: deepseek-v4-flash
      POLICYSCOPE_AUTOMAKER_MODEL: deepseek-v4-flash
      POLICYSCOPE_LLM_TIMEOUT_SECONDS: "120"
      POLICYSCOPE_LLM_MAX_CONCURRENCY: "8"
      POLICYSCOPE_LLM_MAX_TOKENS: "8192"
      POLICYSCOPE_LLM_THINKING: disabled
      POLICYSCOPE_RUNTIME_DIR: /app/runtime
      PYTHONPATH: /app:/app/apps/api/src
      POLICYSCOPE_CORS_ORIGINS: https://final.socialdog.cn
    volumes:
      - m35_runtime:/app/runtime/m34
      - m35_cache:/app/runtime/cache
    networks:
      - edge
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json,urllib.request;
          payload=json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=3));
          assert payload.get('status') == 'ok' and payload.get('run_mode') == 'cache' and payload.get('cache_miss_mode') == 'live'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  m35-web:
    image: policyscope-m35-web:20260814-south-sea-slender7
    build:
      context: ../..
      dockerfile: deploy/m35/Dockerfile.web
    depends_on:
      m35-api:
        condition: service_healthy
    networks:
      - edge
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  edge:
    external: true
    name: anju_anju-internal

volumes:
  m35_runtime:
  m35_cache:
